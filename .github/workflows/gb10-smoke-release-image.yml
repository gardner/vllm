name: GB10 vLLM image smoke evidence

on:
  workflow_dispatch:
    inputs:
      image-ref:
        description: "Candidate vLLM runtime image to smoke test"
        required: true
        default: "ghcr.io/gardner/vllm-gb10:latest-gb10"
        type: string
      release-workflow-run-id:
        description: "Optional GB10 release workflow run ID containing gb10-release-manifest artifact"
        required: false
        default: ""
        type: string
      release-tag:
        description: "Optional GitHub Release tag to attach evidence files to"
        required: false
        default: ""
        type: string
      publish-to-release:
        description: "Attach the evidence bundle to release-tag"
        required: true
        default: false
        type: boolean
      model:
        description: "NVFP4 model id/path used for offline and server smoke"
        required: true
        default: "nvidia/Qwen3.6-35B-A3B-NVFP4"
        type: string
      served-model-name:
        description: "Served model name used by the OpenAI-compatible smoke"
        required: true
        default: "qwen3.6"
        type: string
      max-model-len:
        description: "Max model length for the smoke run"
        required: true
        default: "4096"
        type: string
      require-moe:
        description: "Require native non-EP MoE backend evidence"
        required: true
        default: true
        type: boolean
      require-openai-deterministic:
        description: "Require deterministic OpenAI-compatible generation"
        required: true
        default: true
        type: boolean
      openai-endpoint:
        description: "OpenAI-compatible endpoint to smoke"
        required: true
        default: "chat"
        type: choice
        options:
          - chat
          - completions
      openai-max-tokens:
        description: "OpenAI-compatible smoke max tokens"
        required: true
        default: "32"
        type: string
      openai-repeat-count:
        description: "Repeat count for deterministic OpenAI-compatible smoke"
        required: true
        default: "2"
        type: string
      extra-offline-args:
        description: "Extra args for scripts/gb10-smoke-image.sh after --"
        required: false
        default: ""
        type: string
      extra-serve-args:
        description: "Extra vLLM serve args for the temporary image server"
        required: false
        default: ""
        type: string
      extra-openai-args:
        description: "Extra args for the OpenAI-compatible smoke harness"
        required: false
        default: ""
        type: string
      extra-verify-args:
        description: "Extra args for scripts/gb10-verify-release-evidence.py"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -e -u -o pipefail {0}

jobs:
  smoke:
    name: Smoke final GB10 image
    runs-on: [self-hosted, linux, aarch64, cuda13, dgx-spark, sm121]
    timeout-minutes: 240
    env:
      GB10_IMAGE_REF: ${{ inputs['image-ref'] }}
      GB10_RELEASE_WORKFLOW_RUN_ID: ${{ inputs['release-workflow-run-id'] }}
      GB10_RELEASE_TAG: ${{ inputs['release-tag'] }}
      GB10_PUBLISH_TO_RELEASE: ${{ inputs['publish-to-release'] }}
      GB10_MODEL: ${{ inputs['model'] }}
      GB10_SERVED_MODEL_NAME: ${{ inputs['served-model-name'] }}
      GB10_MAX_MODEL_LEN: ${{ inputs['max-model-len'] }}
      GB10_REQUIRE_MOE: ${{ inputs['require-moe'] }}
      GB10_REQUIRE_OPENAI_DETERMINISTIC: ${{ inputs['require-openai-deterministic'] }}
      GB10_OPENAI_ENDPOINT: ${{ inputs['openai-endpoint'] }}
      GB10_OPENAI_MAX_TOKENS: ${{ inputs['openai-max-tokens'] }}
      GB10_OPENAI_REPEAT_COUNT: ${{ inputs['openai-repeat-count'] }}
      GB10_EXTRA_OFFLINE_ARGS: ${{ inputs['extra-offline-args'] }}
      GB10_EXTRA_SERVE_ARGS: ${{ inputs['extra-serve-args'] }}
      GB10_EXTRA_OPENAI_ARGS: ${{ inputs['extra-openai-args'] }}
      GB10_EXTRA_VERIFY_ARGS: ${{ inputs['extra-verify-args'] }}
      GB10_RELEASE_SMOKE_REPORT_DIR: ${{ github.workspace }}/gb10-smoke-reports
      GB10_RELEASE_EVIDENCE_OUTPUT_DIR: ${{ github.workspace }}/dist/gb10-release-evidence
      GB10_RELEASE_PROVENANCE_DIR: ${{ github.workspace }}/gb10-release-provenance
      GB10_RELEASE_MANIFEST_ARTIFACT_NAME: gb10-release-manifest
      GB10_RELEASE_EVIDENCE_ARTIFACT_NAME: gb10-release-evidence
      GB10_SMOKE_CACHE_DIR: ${{ runner.temp }}/gb10-hf-cache
      GB10_OPENAI_IMAGE_CACHE_DIR: ${{ runner.temp }}/gb10-hf-cache
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show GB10 runner
        run: |
          uname -a
          command -v nvidia-smi >/dev/null
          nvidia-smi
          command -v docker >/dev/null
          docker version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require release publication provenance
        if: inputs['publish-to-release'] && inputs['release-workflow-run-id'] == ''
        run: |
          mkdir -p "$GB10_RELEASE_SMOKE_REPORT_DIR"
          provenance_check_report="$GB10_RELEASE_SMOKE_REPORT_DIR/gb10-provenance-check.json"
          python3 - "$provenance_check_report" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          report = {
              "schema_version": 1,
              "status": "failed",
              "phase": "publication",
              "message": "GB10 release evidence publication requires release-workflow-run-id",
              "release_workflow_run_id": os.environ.get("GB10_RELEASE_WORKFLOW_RUN_ID"),
              "release_tag": os.environ.get("GB10_RELEASE_TAG"),
              "input_image_ref": os.environ.get("GB10_IMAGE_REF"),
              "provenance_dir": os.environ.get("GB10_RELEASE_PROVENANCE_DIR"),
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(report, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          echo "GB10 release evidence publication requires release-workflow-run-id." >&2
          exit 1

      - name: Require release publication tag
        if: inputs['publish-to-release'] && inputs['release-tag'] == ''
        run: |
          mkdir -p "$GB10_RELEASE_SMOKE_REPORT_DIR"
          provenance_check_report="$GB10_RELEASE_SMOKE_REPORT_DIR/gb10-provenance-check.json"
          python3 - "$provenance_check_report" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          report = {
              "schema_version": 1,
              "status": "failed",
              "phase": "publication",
              "message": "GB10 release evidence publication requires release-tag",
              "release_workflow_run_id": os.environ.get("GB10_RELEASE_WORKFLOW_RUN_ID"),
              "release_tag": os.environ.get("GB10_RELEASE_TAG"),
              "input_image_ref": os.environ.get("GB10_IMAGE_REF"),
              "provenance_dir": os.environ.get("GB10_RELEASE_PROVENANCE_DIR"),
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(report, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          echo "GB10 release evidence publication requires release-tag." >&2
          exit 1

      - name: Download release provenance artifact
        if: inputs['release-workflow-run-id'] != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$GB10_RELEASE_PROVENANCE_DIR"
          mkdir -p "$GB10_RELEASE_SMOKE_REPORT_DIR"
          provenance_check_report="$GB10_RELEASE_SMOKE_REPORT_DIR/gb10-provenance-check.json"

          write_provenance_check_report() {
            local status="$1"
            local phase="$2"
            local message="$3"
            python3 - "$provenance_check_report" "$status" "$phase" "$message" <<'PY'
          import json
          import os
          import sys

          path, status, phase, message = sys.argv[1:5]
          report = {
              "schema_version": 1,
              "status": status,
              "phase": phase,
              "message": message,
              "release_workflow_run_id": os.environ.get("GB10_RELEASE_WORKFLOW_RUN_ID"),
              "input_image_ref": os.environ.get("GB10_IMAGE_REF"),
              "manifest_image_ref": os.environ.get("GB10_MANIFEST_IMAGE_REF"),
              "expected_image_ref": os.environ.get("GB10_EXPECTED_IMAGE_REF"),
              "expected_image_digest": os.environ.get("GB10_EXPECTED_IMAGE_DIGEST"),
              "provenance_dir": os.environ.get("GB10_RELEASE_PROVENANCE_DIR"),
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(report, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          }

          if ! gh run download "$GB10_RELEASE_WORKFLOW_RUN_ID" \
            --name "$GB10_RELEASE_MANIFEST_ARTIFACT_NAME" \
            --dir "$GB10_RELEASE_PROVENANCE_DIR"; then
            write_provenance_check_report failed download "GB10 release provenance download failed"
            exit 1
          fi

          provenance_files_file="$(mktemp)"
          trap 'rm -f "$provenance_files_file"' EXIT
          scripts/gb10-list-release-provenance-artifact-files.py \
            --gb10-provenance-dir "$GB10_RELEASE_PROVENANCE_DIR" \
            > "$provenance_files_file"
          mapfile -t provenance_files < "$provenance_files_file"
          if [ "${#provenance_files[@]}" -ne 4 ]; then
            echo "GB10 release provenance file lister returned ${#provenance_files[@]} files; expected 4." >&2
            write_provenance_check_report failed download "GB10 release provenance file lister returned an unexpected file count"
            exit 1
          fi

          manifest="${provenance_files[0]}"
          runtime_metadata="${provenance_files[1]}"
          runtime_image_ref="${provenance_files[2]}"
          runtime_image_digest="${provenance_files[3]}"
          if [ ! -f "$manifest" ]; then
            echo "GB10 release manifest artifact is missing $manifest" >&2
            find "$GB10_RELEASE_PROVENANCE_DIR" -maxdepth 2 -type f -print >&2
            write_provenance_check_report failed download "GB10 release manifest artifact is missing"
            exit 1
          fi
          if [ ! -f "$runtime_metadata" ]; then
            echo "GB10 runtime image metadata artifact is missing $runtime_metadata" >&2
            find "$GB10_RELEASE_PROVENANCE_DIR" -maxdepth 2 -type f -print >&2
            write_provenance_check_report failed download "GB10 runtime image metadata artifact is missing"
            exit 1
          fi
          if [ ! -f "$runtime_image_ref" ]; then
            echo "GB10 runtime image ref artifact is missing $runtime_image_ref" >&2
            find "$GB10_RELEASE_PROVENANCE_DIR" -maxdepth 2 -type f -print >&2
            write_provenance_check_report failed download "GB10 runtime image ref artifact is missing"
            exit 1
          fi
          if [ ! -f "$runtime_image_digest" ]; then
            echo "GB10 runtime image digest artifact is missing $runtime_image_digest" >&2
            find "$GB10_RELEASE_PROVENANCE_DIR" -maxdepth 2 -type f -print >&2
            write_provenance_check_report failed download "GB10 runtime image digest artifact is missing"
            exit 1
          fi

          if ! manifest_image_ref="$(
            python3 - "$manifest" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          image = manifest.get("image") or {}
          name = image.get("name")
          tag = image.get("tag")
          if name and tag:
              print(f"{name}:{tag}")
          PY
          )"; then
            write_provenance_check_report failed manifest "GB10 release manifest image ref parsing failed"
            exit 1
          fi
          export GB10_MANIFEST_IMAGE_REF="$manifest_image_ref"
          echo "GB10_MANIFEST_IMAGE_REF=$manifest_image_ref" >> "$GITHUB_ENV"
          if [ -z "$manifest_image_ref" ]; then
            echo "GB10 release manifest does not include image.name:image.tag." >&2
            write_provenance_check_report failed manifest "GB10 release manifest does not include image.name:image.tag"
            exit 1
          fi
          if [ "$manifest_image_ref" != "$GB10_IMAGE_REF" ]; then
            echo "GB10 release manifest image ref does not match input image-ref." >&2
            echo "  manifest: $manifest_image_ref" >&2
            echo "  input:    $GB10_IMAGE_REF" >&2
            write_provenance_check_report failed manifest "GB10 release manifest image ref does not match input image-ref"
            exit 1
          fi

          echo "GB10_RELEASE_MANIFEST_JSON=$manifest" >> "$GITHUB_ENV"
          echo "GB10_RUNTIME_IMAGE_METADATA_JSON=$runtime_metadata" >> "$GITHUB_ENV"

          expected_ref="$(sed -n '1p' "$runtime_image_ref")"
          if [ -z "$expected_ref" ]; then
            echo "GB10 runtime image ref file is empty." >&2
            write_provenance_check_report failed image_ref "GB10 runtime image ref file is empty"
            exit 1
          fi
          if [ "$expected_ref" != "$GB10_IMAGE_REF" ]; then
            echo "GB10 runtime image ref file does not match input image-ref." >&2
            echo "  ref file: $expected_ref" >&2
            echo "  input:    $GB10_IMAGE_REF" >&2
            export GB10_EXPECTED_IMAGE_REF="$expected_ref"
            write_provenance_check_report failed image_ref "GB10 runtime image ref file does not match input image-ref"
            exit 1
          fi
          export GB10_EXPECTED_IMAGE_REF="$expected_ref"
          echo "GB10_EXPECTED_IMAGE_REF=$expected_ref" >> "$GITHUB_ENV"

          expected_digest="$(sed -n '1p' "$runtime_image_digest")"
          if [ -z "$expected_digest" ]; then
            echo "GB10 runtime image digest file is empty." >&2
            write_provenance_check_report failed digest "GB10 runtime image digest file is empty"
            exit 1
          fi
          if [[ ! "${expected_digest##*@}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "GB10 runtime image digest file is not a valid sha256 digest." >&2
            echo "  digest file: $expected_digest" >&2
            export GB10_EXPECTED_IMAGE_DIGEST="$expected_digest"
            write_provenance_check_report failed digest "GB10 runtime image digest file is not a valid sha256 digest"
            exit 1
          fi
          export GB10_EXPECTED_IMAGE_DIGEST="$expected_digest"
          echo "GB10_EXPECTED_IMAGE_DIGEST=$expected_digest" >> "$GITHUB_ENV"

          write_provenance_check_report passed provenance "release provenance matches input image ref"
          find "$GB10_RELEASE_PROVENANCE_DIR" -maxdepth 2 -type f -print

      - name: Pull candidate image
        run: |
          mkdir -p "$GB10_RELEASE_SMOKE_REPORT_DIR"
          provenance_check_report="$GB10_RELEASE_SMOKE_REPORT_DIR/gb10-provenance-check.json"

          write_provenance_check_report() {
            local status="$1"
            local phase="$2"
            local message="$3"
            local pulled_digest="${4:-}"
            python3 - "$provenance_check_report" "$status" "$phase" "$message" "$pulled_digest" <<'PY'
          import json
          import os
          import sys

          path, status, phase, message, pulled_digest = sys.argv[1:6]
          report = {
              "schema_version": 1,
              "status": status,
              "phase": phase,
              "message": message,
              "release_workflow_run_id": os.environ.get("GB10_RELEASE_WORKFLOW_RUN_ID"),
              "input_image_ref": os.environ.get("GB10_IMAGE_REF"),
              "manifest_image_ref": os.environ.get("GB10_MANIFEST_IMAGE_REF"),
              "expected_image_ref": os.environ.get("GB10_EXPECTED_IMAGE_REF"),
              "expected_image_digest": os.environ.get("GB10_EXPECTED_IMAGE_DIGEST"),
              "pulled_image_digest": pulled_digest or None,
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(report, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          }

          if ! docker pull "$GB10_IMAGE_REF"; then
            write_provenance_check_report failed pull "GB10 candidate image pull failed"
            exit 1
          fi
          image_digest="$(
            docker image inspect "$GB10_IMAGE_REF" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | sed -n '1p'
          )"
          if [ -z "$image_digest" ]; then
            echo "Unable to resolve pulled image digest for $GB10_IMAGE_REF" >&2
            write_provenance_check_report failed pull "Unable to resolve pulled image digest for candidate image"
            exit 1
          fi
          if [[ ! "${image_digest##*@}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "GB10 pulled image digest is not a valid sha256 digest: $image_digest" >&2
            write_provenance_check_report failed digest "GB10 pulled image digest is not a valid sha256 digest" "$image_digest"
            exit 1
          fi
          if [ -n "${GB10_EXPECTED_IMAGE_DIGEST:-}" ]; then
            pulled_digest="${image_digest##*@}"
            expected_digest="${GB10_EXPECTED_IMAGE_DIGEST##*@}"
            if [ "$pulled_digest" != "$expected_digest" ]; then
              echo "GB10 pulled image digest does not match release provenance." >&2
              echo "  pulled:   $pulled_digest" >&2
              echo "  expected: $expected_digest" >&2
              write_provenance_check_report failed digest "GB10 pulled image digest does not match release provenance" "$pulled_digest"
              exit 1
            fi
          fi
          write_provenance_check_report passed pull "candidate image pull and provenance digest checks passed" "$image_digest"
          echo "GB10_IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          release_evidence_files_file="$(mktemp)"
          trap 'rm -f "$release_evidence_files_file"' EXIT
          scripts/gb10-list-release-evidence-report-files.py \
            --gb10-report-dir "$GB10_RELEASE_SMOKE_REPORT_DIR" \
            > "$release_evidence_files_file"
          mapfile -t release_evidence_files < "$release_evidence_files_file"
          if [ "${#release_evidence_files[@]}" -ne 4 ]; then
            echo "GB10 release evidence report lister returned ${#release_evidence_files[@]} files; expected 4." >&2
            write_provenance_check_report failed pull "GB10 release evidence report lister returned an unexpected file count" "$image_digest"
            exit 1
          fi
          smoked_image_digest_report="${release_evidence_files[3]}"
          printf '%s\n' "$image_digest" > "$smoked_image_digest_report"

      - name: Run final-image smoke and evidence verifier
        run: |
          mkdir -p "$GB10_RELEASE_SMOKE_REPORT_DIR"
          mkdir -p "$GB10_RELEASE_EVIDENCE_OUTPUT_DIR"

          if [ "$GB10_REQUIRE_MOE" = "true" ]; then
            export GB10_RELEASE_REQUIRE_MOE=1
          else
            export GB10_RELEASE_REQUIRE_MOE=0
          fi

          if [ "$GB10_REQUIRE_OPENAI_DETERMINISTIC" = "true" ]; then
            export GB10_RELEASE_REQUIRE_OPENAI_DETERMINISTIC=1
          else
            export GB10_RELEASE_REQUIRE_OPENAI_DETERMINISTIC=0
          fi

          append_extra_args() {
            local value="$1"
            local -n target="$2"
            if [ -n "$value" ]; then
              # Inputs are intentionally shell-split for advanced smoke flags.
              # Avoid spaces inside individual argument values.
              # shellcheck disable=SC2206
              local extra_args=($value)
              target+=("${extra_args[@]}")
            fi
          }

          offline_args=(
            --model "$GB10_MODEL"
            --trust-remote-code
            --max-model-len "$GB10_MAX_MODEL_LEN"
            --gb10-require-path linear
            --gb10-expect-backend linear=FlashInferB12x
          )
          if [ "$GB10_REQUIRE_MOE" = "true" ]; then
            offline_args+=(
              --gb10-require-path moe
              --gb10-expect-backend moe=FLASHINFER_B12X
            )
          fi
          append_extra_args "$GB10_EXTRA_OFFLINE_ARGS" offline_args

          serve_args=(
            "$GB10_MODEL"
            --served-model-name "$GB10_SERVED_MODEL_NAME"
            --trust-remote-code
            --quantization modelopt
            --attention-backend flashinfer
            --kv-cache-dtype fp8
            --max-model-len "$GB10_MAX_MODEL_LEN"
          )
          append_extra_args "$GB10_EXTRA_SERVE_ARGS" serve_args

          openai_args=(
            --model "$GB10_SERVED_MODEL_NAME"
            --gb10-endpoint "$GB10_OPENAI_ENDPOINT"
            --gb10-max-tokens "$GB10_OPENAI_MAX_TOKENS"
            --gb10-repeat-count "$GB10_OPENAI_REPEAT_COUNT"
          )
          if [ "$GB10_REQUIRE_OPENAI_DETERMINISTIC" = "true" ]; then
            openai_args+=(--gb10-require-deterministic)
          fi
          append_extra_args "$GB10_EXTRA_OPENAI_ARGS" openai_args

          verify_args=()
          append_extra_args "$GB10_EXTRA_VERIFY_ARGS" verify_args

          scripts/gb10-smoke-release-image.sh "$GB10_IMAGE_REF" \
            --offline "${offline_args[@]}" \
            --serve "${serve_args[@]}" \
            --openai "${openai_args[@]}" \
            --verify "${verify_args[@]}"

      - name: Bundle available evidence after failure
        if: always()
        run: |
          if [ -d "$GB10_RELEASE_SMOKE_REPORT_DIR" ]; then
            bundle_args=(
              --gb10-report-dir "$GB10_RELEASE_SMOKE_REPORT_DIR"
              --gb10-output-dir "$GB10_RELEASE_EVIDENCE_OUTPUT_DIR"
              --gb10-image-ref "$GB10_IMAGE_REF"
              --gb10-release-tag "$GB10_RELEASE_TAG"
              --gb10-allow-partial
            )
            if [ -n "${GB10_RELEASE_MANIFEST_JSON:-}" ]; then
              bundle_args+=(--gb10-release-manifest-json "$GB10_RELEASE_MANIFEST_JSON")
            fi
            if [ -n "${GB10_RUNTIME_IMAGE_METADATA_JSON:-}" ]; then
              bundle_args+=(--gb10-runtime-image-metadata-json "$GB10_RUNTIME_IMAGE_METADATA_JSON")
            fi
            scripts/gb10-bundle-release-evidence.py "${bundle_args[@]}" || true
          fi

      - name: Upload GB10 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GB10_RELEASE_EVIDENCE_ARTIFACT_NAME }}
          if-no-files-found: warn
          path: |
            ${{ env.GB10_RELEASE_SMOKE_REPORT_DIR }}/**
            ${{ env.GB10_RELEASE_PROVENANCE_DIR }}/**
            ${{ env.GB10_RELEASE_EVIDENCE_OUTPUT_DIR }}/**

      - name: Validate GB10 evidence release assets
        id: validate_evidence_release_assets
        if: always() && inputs['publish-to-release'] && inputs['release-tag'] != '' && inputs['release-workflow-run-id'] != ''
        run: |
          scripts/gb10-list-evidence-release-assets.py \
            --gb10-output-dir "$GB10_RELEASE_EVIDENCE_OUTPUT_DIR" >/dev/null
          scripts/gb10-validate-evidence-release-assets.py \
            --gb10-output-dir "$GB10_RELEASE_EVIDENCE_OUTPUT_DIR" \
            --gb10-image-ref "$GB10_IMAGE_REF" \
            --gb10-image-digest "$GB10_IMAGE_DIGEST" \
            --gb10-release-tag "$GB10_RELEASE_TAG"

      - name: Attach evidence to GitHub Release
        if: always() && inputs['publish-to-release'] && inputs['release-tag'] != '' && inputs['release-workflow-run-id'] != '' && steps.validate_evidence_release_assets.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          evidence_assets_file="$(mktemp)"
          trap 'rm -f "$evidence_assets_file"' EXIT
          scripts/gb10-list-evidence-release-assets.py \
            --gb10-output-dir "$GB10_RELEASE_EVIDENCE_OUTPUT_DIR" \
            > "$evidence_assets_file"
          mapfile -t evidence_assets < "$evidence_assets_file"

          if ! gh release view "$GB10_RELEASE_TAG" >/dev/null 2>&1; then
            echo "GB10 release tag does not exist; run the release workflow first: $GB10_RELEASE_TAG" >&2
            exit 1
          fi
          gh release upload "$GB10_RELEASE_TAG" "${evidence_assets[@]}" --clobber
