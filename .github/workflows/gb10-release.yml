name: GB10 vLLM wheel and image

on:
  push:
    tags:
      - "gb10-vllm-v*"
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Optional GitHub Release tag. Tag pushes use the pushed tag."
        required: false
        default: ""
        type: string
      image-name:
        description: "Container image name"
        required: true
        default: "ghcr.io/gardner/vllm-gb10"
        type: string
      prebuilt-wheel-urls:
        description: "Space-separated direct wheel URLs to install before resolving requirements"
        required: false
        default: ""
        type: string
      vllm-flash-attn-git-repository:
        description: "Bundled vLLM flash-attn source repository"
        required: true
        default: "https://github.com/gardner/vllm-flash-attention.git"
        type: string
      vllm-flash-attn-git-tag:
        description: "Bundled vLLM flash-attn source ref"
        required: true
        default: "de3849e75d07edd1c00aec02c92ec852ba757adc"
        type: string
      push-image:
        description: "Push the runtime image to GHCR"
        required: true
        default: true
        type: boolean
      preflight-only:
        description: "Only validate GB10 FlashInfer wheels and build-cache wiring"
        required: true
        default: false
        type: boolean
      runner-labels:
        description: "JSON runner labels. Hosted ARM is for preflight only; full releases require self-hosted GB10 labels."
        required: true
        default: '["ubuntu-22.04-arm"]'
        type: string
      max-jobs:
        description: "CUDA build MAX_JOBS. Self-hosted GB10 defaults to one job to avoid host memory pressure."
        required: true
        default: "1"
        type: string
      nvcc-threads:
        description: "CUDA build NVCC_THREADS. Self-hosted GB10 defaults to one thread to avoid host memory pressure."
        required: true
        default: "1"
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GB10_DEFAULT_PREBUILT_WHEEL_URLS: >-
    https://github.com/gardner/flashinfer/releases/download/gb10-flashinfer-v0.6.12-1c80efb3/flashinfer_python-0.6.12+cu130gb10-py3-none-any.whl
    https://github.com/gardner/flashinfer/releases/download/gb10-flashinfer-v0.6.12-1c80efb3/flashinfer_cubin-0.6.12+cu130gb10-py3-none-any.whl
    https://github.com/gardner/flashinfer/releases/download/gb10-flashinfer-v0.6.12-1c80efb3/flashinfer_jit_cache-0.6.12+cu130gb10-cp39-abi3-manylinux_2_28_aarch64.whl
  GB10_PREFLIGHT_CACHE_REF: ghcr.io/gardner/vllm-gb10-buildcache:preflight
  GB10_WHEEL_CACHE_REF: ghcr.io/gardner/vllm-gb10-buildcache:wheel
  GB10_RUNTIME_CACHE_REF: ghcr.io/gardner/vllm-gb10-buildcache:runtime
  # vLLM divides MAX_JOBS by NVCC_THREADS for CUDA builds; 1 / 1 = 1 job.
  GB10_MAX_JOBS: "1"
  GB10_NVCC_THREADS: "1"
  GB10_NATIVE_CUDA_ARCHS_ONLY: "1"
  GB10_BUILD_HEARTBEAT_SECONDS: "300"
  GB10_BUILD_HEARTBEAT_DOCKER_DF: "1"
  GB10_SELF_HOSTED_RUNNER_LABELS: '["self-hosted","linux","aarch64","cuda13","dgx-spark","sm121"]'

defaults:
  run:
    shell: bash -e -u -o pipefail {0}

jobs:
  build:
    name: Build GB10 artifacts
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs['runner-labels'] || '["self-hosted","linux","aarch64","cuda13","dgx-spark","sm121"]') }}
    timeout-minutes: 360
    env:
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: plain
      GB10_RELEASE_MANIFEST_DIR: gb10-release-manifest
      GB10_RUNTIME_IMAGE_METADATA_JSON: gb10-release-manifest/buildx-runtime-image-metadata.json
      GB10_RELEASE_MANIFEST_ARTIFACT_NAME: gb10-release-manifest
      GB10_RELEASE_INPUTS_ARTIFACT_NAME: gb10-release-inputs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release settings
        env:
          GB10_INPUT_RELEASE_TAG: ${{ inputs['release-tag'] }}
          GB10_INPUT_IMAGE_NAME: ${{ inputs['image-name'] }}
          GB10_INPUT_PREBUILT_WHEEL_URLS: ${{ inputs['prebuilt-wheel-urls'] }}
          GB10_INPUT_FLASH_ATTN_REPO: ${{ inputs['vllm-flash-attn-git-repository'] }}
          GB10_INPUT_FLASH_ATTN_REF: ${{ inputs['vllm-flash-attn-git-tag'] }}
          GB10_INPUT_PUSH_IMAGE: ${{ inputs['push-image'] }}
          GB10_INPUT_PREFLIGHT_ONLY: ${{ inputs['preflight-only'] }}
          GB10_INPUT_RUNNER_LABELS: ${{ inputs['runner-labels'] }}
          GB10_INPUT_MAX_JOBS: ${{ inputs['max-jobs'] }}
          GB10_INPUT_NVCC_THREADS: ${{ inputs['nvcc-threads'] }}
        run: |
          python3 scripts/gb10-resolve-release-settings.py \
            --gb10-output-env "$GITHUB_ENV"

      - name: Write GB10 release manifest
        run: |
          mkdir -p "$GB10_RELEASE_MANIFEST_DIR"
          scripts/gb10-write-release-manifest.py \
            --gb10-validate-release-inputs \
            --gb10-output-json "$GB10_RELEASE_MANIFEST_DIR/gb10-release-manifest.json"
          cat "$GB10_RELEASE_MANIFEST_DIR/gb10-release-manifest.json"

      - name: Upload GB10 release inputs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GB10_RELEASE_INPUTS_ARTIFACT_NAME }}
          path: ${{ env.GB10_RELEASE_MANIFEST_DIR }}/gb10-release-manifest.json

      - name: Verify GB10 native CUDA arch contract
        run: |
          python3 scripts/gb10-check-native-cuda-arch-contract.py --gb10-require-env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight GB10 FlashInfer wheels
        run: |
          docker buildx build \
            --progress=plain \
            --file docker/Dockerfile \
            --target gb10-flashinfer-preflight \
            --platform linux/arm64 \
            --cache-from type=gha,scope=gb10-vllm-preflight \
            --cache-from type=registry,ref="$GB10_PREFLIGHT_CACHE_REF" \
            --cache-to type=gha,scope=gb10-vllm-preflight,mode=max \
            --cache-to type=registry,ref="$GB10_PREFLIGHT_CACHE_REF",mode=max \
            --build-arg gb10_prebuilt_wheel_urls="$GB10_PREBUILT_WHEEL_URLS" \
            --build-arg gb10_require_flashinfer_wheels=true \
            .

      - name: Build wheel stage
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          bash scripts/gb10-run-with-heartbeat.sh "wheel stage" \
            docker buildx build \
              --progress=plain \
              --file docker/Dockerfile \
              --target build \
              --platform linux/arm64 \
              --load \
              --tag vllm-gb10-wheel:${GITHUB_SHA::12} \
              --cache-from type=gha,scope=gb10-vllm \
              --cache-from type=gha,scope=gb10-vllm-wheel \
              --cache-from type=registry,ref="$GB10_WHEEL_CACHE_REF" \
              --cache-to type=gha,scope=gb10-vllm-wheel,mode=max \
              --cache-to type=registry,ref="$GB10_WHEEL_CACHE_REF",mode=max \
              --build-arg max_jobs="$GB10_MAX_JOBS" \
              --build-arg nvcc_threads="$GB10_NVCC_THREADS" \
              --build-arg vllm_native_cuda_archs_only="$GB10_NATIVE_CUDA_ARCHS_ONLY" \
              --build-arg gb10_prebuilt_wheel_urls="$GB10_PREBUILT_WHEEL_URLS" \
              --build-arg gb10_require_flashinfer_wheels=true \
              --build-arg vllm_version_override="$GB10_VLLM_VERSION" \
              --build-arg vllm_flash_attn_git_repository="$GB10_FLASH_ATTN_REPO" \
              --build-arg vllm_flash_attn_git_tag="$GB10_FLASH_ATTN_REF" \
              --build-arg VLLM_BUILD_COMMIT="$GITHUB_SHA" \
              --build-arg VLLM_BUILD_PIPELINE="$GITHUB_WORKFLOW" \
              --build-arg VLLM_BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --build-arg VLLM_IMAGE_TAG="$GB10_IMAGE_TAG" \
              .

      - name: Extract vLLM wheel
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          mkdir -p dist
          cid="$(docker create vllm-gb10-wheel:${GITHUB_SHA::12})"
          docker cp "$cid:/workspace/dist/." dist/
          docker rm "$cid"
          ls -lh dist

      - name: Verify wheel contains only SM121A CUDA images
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          wheel="$(ls dist/vllm-*.whl | head -n1)"
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -e WHEEL="/dist/$(basename "$wheel")" \
            vllm-gb10-wheel:${GITHUB_SHA::12} \
            python3 - <<'PY'
          import os
          import re
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          wheel = Path(os.environ["WHEEL"])
          tmp = Path(tempfile.mkdtemp())
          with zipfile.ZipFile(wheel) as zf:
              zf.extractall(tmp)

          found_cuda = False
          allowed = {"sm_121a", "compute_121a"}
          for so_file in tmp.rglob("*.so"):
              proc = subprocess.run(
                  ["cuobjdump", "--list-elf", str(so_file)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
              )
              tokens = set(re.findall(r"(?:sm|compute)_[0-9]+[a-z]?", proc.stdout))
              if not tokens:
                  continue
              found_cuda = True
              bad = sorted(tokens - allowed)
              if bad:
                  raise SystemExit(f"{so_file}: unexpected CUDA images: {bad}")

          if not found_cuda:
              raise SystemExit(f"{wheel}: no CUDA images found")
          PY

      - name: Upload wheel artifact
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gb10-vllm-wheel
          path: dist/*.whl

      - name: Build runtime image
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          output_arg="--load"
          if [ "$GB10_PUSH_IMAGE" = "true" ]; then
            output_arg="--push"
          fi

          bash scripts/gb10-run-with-heartbeat.sh "runtime image" \
            docker buildx build \
              --progress=plain \
              --file docker/Dockerfile \
              --target vllm-openai \
              --platform linux/arm64 \
              --tag "$GB10_IMAGE_NAME:$GB10_IMAGE_TAG" \
              --tag "$GB10_IMAGE_NAME:latest-gb10" \
              --cache-from type=gha,scope=gb10-vllm \
              --cache-from type=gha,scope=gb10-vllm-wheel \
              --cache-from type=gha,scope=gb10-vllm-runtime \
              --cache-from type=registry,ref="$GB10_WHEEL_CACHE_REF" \
              --cache-from type=registry,ref="$GB10_RUNTIME_CACHE_REF" \
              --cache-to type=gha,scope=gb10-vllm-runtime,mode=max \
              --cache-to type=registry,ref="$GB10_RUNTIME_CACHE_REF",mode=max \
              --build-arg max_jobs="$GB10_MAX_JOBS" \
              --build-arg nvcc_threads="$GB10_NVCC_THREADS" \
              --build-arg vllm_native_cuda_archs_only="$GB10_NATIVE_CUDA_ARCHS_ONLY" \
              --build-arg gb10_prebuilt_wheel_urls="$GB10_PREBUILT_WHEEL_URLS" \
              --build-arg gb10_require_flashinfer_wheels=true \
              --build-arg vllm_version_override="$GB10_VLLM_VERSION" \
              --build-arg vllm_flash_attn_git_repository="$GB10_FLASH_ATTN_REPO" \
              --build-arg vllm_flash_attn_git_tag="$GB10_FLASH_ATTN_REF" \
              --build-arg VLLM_BUILD_COMMIT="$GITHUB_SHA" \
              --build-arg VLLM_BUILD_PIPELINE="$GITHUB_WORKFLOW" \
              --build-arg VLLM_BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --build-arg VLLM_IMAGE_TAG="$GB10_IMAGE_TAG" \
              --metadata-file "$GB10_RUNTIME_IMAGE_METADATA_JSON" \
              "$output_arg" \
              .
          cat "$GB10_RUNTIME_IMAGE_METADATA_JSON"

      - name: Write GB10 runtime image refs
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          scripts/gb10-write-runtime-image-provenance.py \
            --gb10-runtime-image-metadata-json "$GB10_RUNTIME_IMAGE_METADATA_JSON" \
            --gb10-release-manifest-dir "$GB10_RELEASE_MANIFEST_DIR" \
            --gb10-image-name "$GB10_IMAGE_NAME" \
            --gb10-image-tag "$GB10_IMAGE_TAG" \
            --gb10-push-image "$GB10_PUSH_IMAGE"

      - name: Write GB10 release checksums
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          scripts/gb10-write-vllm-release-checksums.py \
            --gb10-dist-dir dist \
            --gb10-release-manifest-dir "$GB10_RELEASE_MANIFEST_DIR" \
            --gb10-runtime-image-metadata-json "$GB10_RUNTIME_IMAGE_METADATA_JSON"
          cat "$GB10_RELEASE_MANIFEST_DIR/gb10-vllm-release-SHA256SUMS"

      - name: Validate GB10 release assets
        if: env.GB10_PREFLIGHT_ONLY != 'true' && env.GB10_RELEASE_TAG != ''
        run: |
          scripts/gb10-validate-vllm-release-assets.py \
            --gb10-dist-dir dist \
            --gb10-release-manifest-dir "$GB10_RELEASE_MANIFEST_DIR" \
            --gb10-runtime-image-metadata-json "$GB10_RUNTIME_IMAGE_METADATA_JSON"

      - name: Upload GB10 release manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GB10_RELEASE_MANIFEST_ARTIFACT_NAME }}
          path: ${{ env.GB10_RELEASE_MANIFEST_DIR }}/**

      - name: Publish GB10 release assets
        if: env.GB10_PREFLIGHT_ONLY != 'true' && env.GB10_RELEASE_TAG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_assets_file="$(mktemp)"
          release_ref_file="$(mktemp)"
          trap 'rm -f "$release_assets_file" "$release_ref_file"' EXIT
          scripts/gb10-list-vllm-release-assets.py \
            --gb10-dist-dir dist \
            --gb10-release-manifest-dir "$GB10_RELEASE_MANIFEST_DIR" \
            --gb10-runtime-image-metadata-json "$GB10_RUNTIME_IMAGE_METADATA_JSON" \
            > "$release_assets_file"
          mapfile -t release_assets < "$release_assets_file"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GB10_RELEASE_TAG}" \
            > "$release_ref_file" 2>/dev/null; then
            tag_sha="$(jq -r '.object.sha // ""' "$release_ref_file")"
            tag_type="$(jq -r '.object.type // ""' "$release_ref_file")"
            if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "GB10 release tag must point at the workflow commit before assets are uploaded." >&2
              echo "  release-tag: ${GB10_RELEASE_TAG}" >&2
              echo "  tag-type:    ${tag_type}" >&2
              echo "  tag-sha:     ${tag_sha}" >&2
              echo "  workflow-sha:${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

          if ! gh release view "$GB10_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$GB10_RELEASE_TAG" --target "$GITHUB_SHA" --title "$GB10_RELEASE_TAG" --notes "GB10/DGX Spark native vLLM wheel and image"
          fi
          gh release upload "$GB10_RELEASE_TAG" "${release_assets[@]}" --clobber
