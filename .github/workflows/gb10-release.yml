name: GB10 vLLM wheel and image

on:
  push:
    tags:
      - "gb10-vllm-v*"
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Optional GitHub Release tag. Tag pushes use the pushed tag."
        required: false
        default: ""
        type: string
      image-name:
        description: "Container image name"
        required: true
        default: "ghcr.io/gardner/vllm-gb10"
        type: string
      prebuilt-wheel-urls:
        description: "Space-separated direct wheel URLs to install before resolving requirements"
        required: false
        default: ""
        type: string
      vllm-flash-attn-git-repository:
        description: "Bundled vLLM flash-attn source repository"
        required: true
        default: "https://github.com/gardner/vllm-flash-attention.git"
        type: string
      vllm-flash-attn-git-tag:
        description: "Bundled vLLM flash-attn source ref"
        required: true
        default: "de3849e75d07edd1c00aec02c92ec852ba757adc"
        type: string
      push-image:
        description: "Push the runtime image to GHCR"
        required: true
        default: true
        type: boolean
      preflight-only:
        description: "Only validate GB10 FlashInfer wheels and build-cache wiring"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GB10_DEFAULT_PREBUILT_WHEEL_URLS: >-
    https://github.com/gardner/flashinfer/releases/download/gb10-flashinfer-v0.6.12-1c80efb3/flashinfer_python-0.6.12+cu130gb10-py3-none-any.whl
    https://github.com/gardner/flashinfer/releases/download/gb10-flashinfer-v0.6.12-1c80efb3/flashinfer_cubin-0.6.12+cu130gb10-py3-none-any.whl
    https://github.com/gardner/flashinfer/releases/download/gb10-flashinfer-v0.6.12-1c80efb3/flashinfer_jit_cache-0.6.12+cu130gb10-cp39-abi3-manylinux_2_28_aarch64.whl
  GB10_PREFLIGHT_CACHE_REF: ghcr.io/gardner/vllm-gb10-buildcache:preflight
  GB10_WHEEL_CACHE_REF: ghcr.io/gardner/vllm-gb10-buildcache:wheel
  GB10_RUNTIME_CACHE_REF: ghcr.io/gardner/vllm-gb10-buildcache:runtime
  # vLLM divides MAX_JOBS by NVCC_THREADS for CUDA builds; 24 / 8 = 3 jobs.
  GB10_MAX_JOBS: "24"
  GB10_NVCC_THREADS: "8"

defaults:
  run:
    shell: bash -e -u -o pipefail {0}

jobs:
  build:
    name: Build GB10 artifacts
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360
    env:
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: plain
      GB10_RELEASE_MANIFEST_DIR: gb10-release-manifest
      GB10_RUNTIME_IMAGE_METADATA_JSON: gb10-release-manifest/buildx-runtime-image-metadata.json
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release settings
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            release_tag="${GITHUB_REF#refs/tags/}"
            image_name="ghcr.io/gardner/vllm-gb10"
            prebuilt_wheel_urls="$GB10_DEFAULT_PREBUILT_WHEEL_URLS"
            flash_attn_repo="https://github.com/gardner/vllm-flash-attention.git"
            flash_attn_ref="de3849e75d07edd1c00aec02c92ec852ba757adc"
            push_image="true"
            preflight_only="false"
          else
            release_tag="${{ inputs.release-tag }}"
            image_name="${{ inputs.image-name }}"
            prebuilt_wheel_urls="${{ inputs.prebuilt-wheel-urls }}"
            flash_attn_repo="${{ inputs.vllm-flash-attn-git-repository }}"
            flash_attn_ref="${{ inputs.vllm-flash-attn-git-tag }}"
            push_image="${{ inputs.push-image }}"
            preflight_only="${{ inputs['preflight-only'] }}"
          fi
          if [ -z "${prebuilt_wheel_urls}" ]; then
            prebuilt_wheel_urls="$GB10_DEFAULT_PREBUILT_WHEEL_URLS"
          fi

          reject_multiline_env_value() {
            local name="$1"
            local value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "GB10 release setting must be single-line: ${name}" >&2
              exit 1
            fi
          }

          if [ "$preflight_only" != "true" ] && [ -n "$release_tag" ] && [ "$push_image" != "true" ]; then
            echo "GB10 full release publication requires push-image=true so the runtime image is durable in GHCR." >&2
            exit 1
          fi

          if [ -z "${prebuilt_wheel_urls}" ]; then
            echo "GB10 prebuilt FlashInfer wheel URLs are required." >&2
            exit 1
          fi
          for required_wheel in flashinfer_python flashinfer_cubin flashinfer_jit_cache; do
            if [[ " ${prebuilt_wheel_urls} " != *"${required_wheel}"* ]]; then
              echo "GB10 prebuilt wheel URLs must include ${required_wheel}." >&2
              exit 1
            fi
          done

          image_tag="${release_tag:-gb10-${GITHUB_SHA::12}}"
          if [ "$preflight_only" != "true" ] && [ -n "$release_tag" ]; then
            if [[ "$image_name" != ghcr.io/* ]]; then
              echo "GB10 full release publication requires a GHCR image-name, got ${image_name}." >&2
              exit 1
            fi
            if [[ "$image_name" == *:* || "$image_name" == *@* ]]; then
              echo "GB10 full release image-name must not include a tag or digest, got ${image_name}." >&2
              exit 1
            fi
            image_repository="${image_name#ghcr.io/}"
            IFS=/ read -r -a image_repository_parts <<< "$image_repository"
            if [ "${#image_repository_parts[@]}" -lt 2 ]; then
              echo "GB10 full release image-name must include owner and package components, got ${image_name}." >&2
              exit 1
            fi
            for image_repository_part in "${image_repository_parts[@]}"; do
              if [[ ! "$image_repository_part" =~ ^[a-z0-9]+([._-]+[a-z0-9]+)*$ ]]; then
                echo "GB10 full release image-name must be a lowercase Docker repository name, got ${image_name}." >&2
                exit 1
              fi
            done
            if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "GB10 full release runtime image tag must be a Docker-compatible tag, got ${image_tag}." >&2
              exit 1
            fi
            if [ "$image_tag" != "$release_tag" ]; then
              echo "GB10 full release runtime image tag must match the release tag." >&2
              echo "  image-tag:   ${image_tag}" >&2
              echo "  release-tag: ${release_tag}" >&2
              exit 1
            fi
          fi

          vllm_version_base="0.22.1rc0"
          if [[ "${release_tag}" =~ ^gb10-vllm-v([^-]+)-[0-9a-f]{7,40}$ ]]; then
            vllm_version_base="${BASH_REMATCH[1]}"
          fi
          vllm_version="${vllm_version_base}+gb10.${GITHUB_SHA::12}"
          reject_multiline_env_value "release_tag" "$release_tag"
          reject_multiline_env_value "image_name" "$image_name"
          reject_multiline_env_value "image_tag" "$image_tag"
          reject_multiline_env_value "vllm_version" "$vllm_version"
          reject_multiline_env_value "prebuilt_wheel_urls" "$prebuilt_wheel_urls"
          reject_multiline_env_value "flash_attn_repo" "$flash_attn_repo"
          reject_multiline_env_value "flash_attn_ref" "$flash_attn_ref"
          reject_multiline_env_value "push_image" "$push_image"
          reject_multiline_env_value "preflight_only" "$preflight_only"
          {
            echo "GB10_RELEASE_TAG=${release_tag}"
            echo "GB10_IMAGE_NAME=${image_name}"
            echo "GB10_IMAGE_TAG=${image_tag}"
            echo "GB10_VLLM_VERSION=${vllm_version}"
            echo "GB10_PREBUILT_WHEEL_URLS=${prebuilt_wheel_urls}"
            echo "GB10_FLASH_ATTN_REPO=${flash_attn_repo}"
            echo "GB10_FLASH_ATTN_REF=${flash_attn_ref}"
            echo "GB10_PUSH_IMAGE=${push_image}"
            echo "GB10_PREFLIGHT_ONLY=${preflight_only}"
          } >> "$GITHUB_ENV"

      - name: Write GB10 release manifest
        run: |
          mkdir -p "$GB10_RELEASE_MANIFEST_DIR"
          scripts/gb10-write-release-manifest.py \
            --gb10-validate-release-inputs \
            --gb10-output-json "$GB10_RELEASE_MANIFEST_DIR/gb10-release-manifest.json"
          cat "$GB10_RELEASE_MANIFEST_DIR/gb10-release-manifest.json"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight GB10 FlashInfer wheels
        run: |
          docker buildx build \
            --file docker/Dockerfile \
            --target gb10-flashinfer-preflight \
            --platform linux/arm64 \
            --load \
            --tag vllm-gb10-flashinfer-preflight:${GITHUB_SHA::12} \
            --cache-from type=gha,scope=gb10-vllm-preflight \
            --cache-from type=registry,ref="$GB10_PREFLIGHT_CACHE_REF" \
            --cache-to type=gha,scope=gb10-vllm-preflight,mode=max \
            --cache-to type=registry,ref="$GB10_PREFLIGHT_CACHE_REF",mode=max \
            --build-arg gb10_prebuilt_wheel_urls="$GB10_PREBUILT_WHEEL_URLS" \
            --build-arg gb10_require_flashinfer_wheels=true \
            .

      - name: Build wheel stage
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          docker buildx build \
            --file docker/Dockerfile \
            --target build \
            --platform linux/arm64 \
            --load \
            --tag vllm-gb10-wheel:${GITHUB_SHA::12} \
            --cache-from type=gha,scope=gb10-vllm \
            --cache-from type=gha,scope=gb10-vllm-wheel \
            --cache-from type=registry,ref="$GB10_WHEEL_CACHE_REF" \
            --cache-to type=gha,scope=gb10-vllm-wheel,mode=max \
            --cache-to type=registry,ref="$GB10_WHEEL_CACHE_REF",mode=max \
            --build-arg max_jobs="$GB10_MAX_JOBS" \
            --build-arg nvcc_threads="$GB10_NVCC_THREADS" \
            --build-arg gb10_prebuilt_wheel_urls="$GB10_PREBUILT_WHEEL_URLS" \
            --build-arg gb10_require_flashinfer_wheels=true \
            --build-arg vllm_version_override="$GB10_VLLM_VERSION" \
            --build-arg vllm_flash_attn_git_repository="$GB10_FLASH_ATTN_REPO" \
            --build-arg vllm_flash_attn_git_tag="$GB10_FLASH_ATTN_REF" \
            .

      - name: Extract vLLM wheel
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          mkdir -p dist
          cid="$(docker create vllm-gb10-wheel:${GITHUB_SHA::12})"
          docker cp "$cid:/workspace/dist/." dist/
          docker rm "$cid"
          ls -lh dist

      - name: Verify wheel contains only SM121A CUDA images
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          wheel="$(ls dist/vllm-*.whl | head -n1)"
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -e WHEEL="/dist/$(basename "$wheel")" \
            vllm-gb10-wheel:${GITHUB_SHA::12} \
            python3 - <<'PY'
          import os
          import re
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          wheel = Path(os.environ["WHEEL"])
          tmp = Path(tempfile.mkdtemp())
          with zipfile.ZipFile(wheel) as zf:
              zf.extractall(tmp)

          found_cuda = False
          allowed = {"sm_121a", "compute_121a"}
          for so_file in tmp.rglob("*.so"):
              proc = subprocess.run(
                  ["cuobjdump", "--list-elf", str(so_file)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
              )
              tokens = set(re.findall(r"(?:sm|compute)_[0-9]+[a-z]?", proc.stdout))
              if not tokens:
                  continue
              found_cuda = True
              bad = sorted(tokens - allowed)
              if bad:
                  raise SystemExit(f"{so_file}: unexpected CUDA images: {bad}")

          if not found_cuda:
              raise SystemExit(f"{wheel}: no CUDA images found")
          PY

      - name: Upload wheel artifact
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gb10-vllm-wheel
          path: dist/*.whl

      - name: Build runtime image
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          output_arg="--load"
          if [ "$GB10_PUSH_IMAGE" = "true" ]; then
            output_arg="--push"
          fi

          docker buildx build \
            --file docker/Dockerfile \
            --target vllm-openai \
            --platform linux/arm64 \
            --tag "$GB10_IMAGE_NAME:$GB10_IMAGE_TAG" \
            --tag "$GB10_IMAGE_NAME:latest-gb10" \
            --cache-from type=gha,scope=gb10-vllm \
            --cache-from type=gha,scope=gb10-vllm-wheel \
            --cache-from type=gha,scope=gb10-vllm-runtime \
            --cache-from type=registry,ref="$GB10_WHEEL_CACHE_REF" \
            --cache-from type=registry,ref="$GB10_RUNTIME_CACHE_REF" \
            --cache-to type=gha,scope=gb10-vllm-runtime,mode=max \
            --cache-to type=registry,ref="$GB10_RUNTIME_CACHE_REF",mode=max \
            --build-arg max_jobs="$GB10_MAX_JOBS" \
            --build-arg nvcc_threads="$GB10_NVCC_THREADS" \
            --build-arg gb10_prebuilt_wheel_urls="$GB10_PREBUILT_WHEEL_URLS" \
            --build-arg gb10_require_flashinfer_wheels=true \
            --build-arg vllm_version_override="$GB10_VLLM_VERSION" \
            --build-arg vllm_flash_attn_git_repository="$GB10_FLASH_ATTN_REPO" \
            --build-arg vllm_flash_attn_git_tag="$GB10_FLASH_ATTN_REF" \
            --metadata-file "$GB10_RUNTIME_IMAGE_METADATA_JSON" \
            $output_arg \
            .
          cat "$GB10_RUNTIME_IMAGE_METADATA_JSON"

      - name: Write GB10 runtime image refs
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          scripts/gb10-write-runtime-image-provenance.py \
            --gb10-runtime-image-metadata-json "$GB10_RUNTIME_IMAGE_METADATA_JSON" \
            --gb10-release-manifest-dir "$GB10_RELEASE_MANIFEST_DIR" \
            --gb10-image-name "$GB10_IMAGE_NAME" \
            --gb10-image-tag "$GB10_IMAGE_TAG" \
            --gb10-push-image "$GB10_PUSH_IMAGE"

      - name: Write GB10 release checksums
        if: env.GB10_PREFLIGHT_ONLY != 'true'
        run: |
          scripts/gb10-write-vllm-release-checksums.py \
            --gb10-dist-dir dist \
            --gb10-release-manifest-dir "$GB10_RELEASE_MANIFEST_DIR" \
            --gb10-runtime-image-metadata-json "$GB10_RUNTIME_IMAGE_METADATA_JSON"
          cat "$GB10_RELEASE_MANIFEST_DIR/gb10-vllm-release-SHA256SUMS"

      - name: Validate GB10 release assets
        if: env.GB10_PREFLIGHT_ONLY != 'true' && env.GB10_RELEASE_TAG != ''
        run: |
          scripts/gb10-validate-vllm-release-assets.py \
            --gb10-dist-dir dist \
            --gb10-release-manifest-dir "$GB10_RELEASE_MANIFEST_DIR" \
            --gb10-runtime-image-metadata-json "$GB10_RUNTIME_IMAGE_METADATA_JSON"

      - name: Upload GB10 release manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gb10-release-manifest
          path: gb10-release-manifest/**

      - name: Publish GB10 release assets
        if: env.GB10_PREFLIGHT_ONLY != 'true' && env.GB10_RELEASE_TAG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t release_assets < <(
            scripts/gb10-list-vllm-release-assets.py \
              --gb10-dist-dir dist \
              --gb10-release-manifest-dir "$GB10_RELEASE_MANIFEST_DIR" \
              --gb10-runtime-image-metadata-json "$GB10_RUNTIME_IMAGE_METADATA_JSON"
          )

          if ! gh release view "$GB10_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$GB10_RELEASE_TAG" --title "$GB10_RELEASE_TAG" --notes "GB10/DGX Spark native vLLM wheel and image"
          fi
          gh release upload "$GB10_RELEASE_TAG" "${release_assets[@]}" --clobber
